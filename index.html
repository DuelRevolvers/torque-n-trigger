<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#160a2b" />
    <title>Torque &amp; Trigger</title>
    <style>
      :root {
        --night: #160a2b;
        --pink: #ff2a6d;
        --cyan: #05d9e8;
        --amber: #ffb000;
        --ink: #e8e8ff;
        --panel: rgba(12, 5, 30, 0.88);
        --font: 'Courier New', ui-monospace, monospace;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #000;
        color: var(--ink);
        font-family: var(--font);
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
      }
      #game { display: block; width: 100vw; height: 100vh; }
      [hidden] { display: none !important; }

      #pause-btn {
        position: fixed;
        top: max(8px, env(safe-area-inset-top));
        right: max(8px, env(safe-area-inset-right));
        width: 40px;
        height: 40px;
        border: 2px solid var(--cyan);
        background: var(--panel);
        color: var(--cyan);
        font: bold 16px Arial, Helvetica, sans-serif;
        cursor: pointer;
        z-index: 3;
      }

      /* Pause menu */
      #menu {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(8, 2, 20, 0.55);
        z-index: 4;
        padding: 16px;
      }
      .menu-panel {
        width: min(440px, 100%);
        max-height: 100%;
        overflow-y: auto;
        background: var(--panel);
        border: 3px solid var(--pink);
        box-shadow: 0 0 0 3px #000, 6px 6px 0 3px var(--cyan);
        padding: 16px;
      }
      .menu-panel h1 {
        margin: 0 0 12px;
        font-size: 28px;
        letter-spacing: 4px;
        color: var(--pink);
        text-shadow: 3px 3px 0 #000;
      }
      .menu-row, .menu-resume {
        display: flex;
        justify-content: space-between;
        width: 100%;
        padding: 9px 10px;
        margin-bottom: 4px;
        background: #1a1030;
        border: 2px solid #33245a;
        color: var(--ink);
        font: bold 15px var(--font);
        text-transform: uppercase;
        cursor: pointer;
      }
      .menu-row:hover, .menu-row:focus-visible { border-color: var(--cyan); outline: none; }
      .menu-value { color: var(--cyan); }
      .menu-resume {
        justify-content: center;
        margin-top: 10px;
        background: var(--pink);
        border-color: #000;
        color: #000;
        font-size: 18px;
      }
      .menu-help { margin-top: 12px; font-size: 12px; line-height: 1.5; color: #a89fd0; }
      .menu-help b { color: var(--amber); }
      .menu-ask { margin: 0 0 10px; font-size: 14px; color: var(--ink); }

      /* Touch controls */
      #touch { position: fixed; inset: 0; pointer-events: none; z-index: 2; }
      #touch > * { pointer-events: auto; }
      .t-steer {
        position: absolute;
        left: 0;
        bottom: 0;
        width: 42%;
        height: 55%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-end;
        padding-bottom: max(28px, env(safe-area-inset-bottom));
      }
      .t-steer-track {
        width: 150px;
        height: 22px;
        border: 2px solid var(--cyan);
        background: rgba(12, 5, 30, 0.5);
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .t-steer-knob { width: 34px; height: 34px; background: var(--cyan); border: 2px solid #000; }
      .t-label { margin-top: 6px; font: bold 11px var(--font); color: var(--cyan); opacity: 0.7; }
      .t-buttons {
        position: absolute;
        right: max(14px, env(safe-area-inset-right));
        bottom: max(18px, env(safe-area-inset-bottom));
        display: grid;
        grid-template-columns: 78px 92px;
        grid-template-rows: 64px 64px 92px;
        gap: 10px;
      }
      .t-btn {
        border: 2px solid var(--ink);
        background: rgba(12, 5, 30, 0.55);
        color: var(--ink);
        font: bold 14px var(--font);
        touch-action: none;
      }
      .t-btn.down { background: var(--ink); color: #000; }
      .t-gas { grid-column: 2; grid-row: 3; border-color: var(--cyan); color: var(--cyan); }
      .t-brake { grid-column: 1; grid-row: 3; border-color: var(--pink); color: var(--pink); }
      .t-nitro { grid-column: 2; grid-row: 2; border-color: var(--amber); color: var(--amber); }
      .t-drift { grid-column: 1; grid-row: 2; }
      .t-fire { grid-column: 2; grid-row: 1; border-color: #ff2030; color: #ff2030; }
      .t-alt { grid-column: 1; grid-row: 1; border-color: #b04dff; color: #b04dff; }
      .warn-text { color: var(--amber); font-style: normal; }
      .slot-btn em { font-style: normal; }
      .repair { margin-top: 8px; width: 100%; }
      .t-top {
        position: absolute;
        top: max(8px, env(safe-area-inset-top));
        right: calc(max(8px, env(safe-area-inset-right)) + 50px);
        display: flex;
        gap: 8px;
      }
      .t-small { width: 64px; height: 40px; font-size: 12px; }

      /* Screens (starter selection, garage) */
      #ui { position: fixed; inset: 0; pointer-events: none; z-index: 1; font-size: 13px; }
      #ui .screen { position: absolute; inset: 0; }
      #ui button, #ui select, #ui input, #ui textarea, #ui .card, #ui .g-slots, #ui .g-side { pointer-events: auto; }
      #ui h1 { margin: 0; font-size: 26px; letter-spacing: 3px; color: var(--pink); text-shadow: 3px 3px 0 #000; }
      #ui h2 { margin: 0 0 8px; font-size: 17px; color: var(--cyan); text-transform: uppercase; }
      #ui h3 { margin: 12px 0 6px; font-size: 13px; color: var(--amber); text-transform: uppercase; }
      .btn {
        font: bold 14px var(--font); padding: 8px 14px; background: #1a1030; color: var(--ink);
        border: 2px solid #33245a; cursor: pointer; text-transform: uppercase;
      }
      .btn:hover:not(:disabled) { border-color: var(--cyan); }
      .btn.primary { background: var(--pink); color: #000; border-color: #000; box-shadow: 3px 3px 0 var(--cyan); }
      .btn.small { padding: 5px 9px; font-size: 12px; }
      .btn.on { border-color: var(--cyan); color: var(--cyan); }
      .btn:disabled { opacity: 0.4; cursor: default; }
      .tag { background: var(--cyan); color: #000; padding: 1px 6px; font-size: 11px; vertical-align: middle; }
      .q-junk { color: #c08050; } .q-stock { color: #b8b8c8; } .q-street { color: #ffffff; }
      .q-sport { color: #39ff14; } .q-race { color: var(--cyan); } .q-elite { color: var(--amber); }
      .panel, .card, .g-stats, .g-detail, .g-slots {
        background: var(--panel); border: 2px solid #33245a;
      }
      .pr { font-size: 15px; margin-bottom: 6px; } .pr b { font-size: 22px; color: var(--amber); }
      .up { color: #39ff14; } .down { color: var(--pink); }
      .stat { display: grid; grid-template-columns: 92px minmax(40px, 1fr) auto; gap: 8px; align-items: center; margin: 2px 0; font-size: 12px; }
      .stat-label { color: #a89fd0; }
      .stat-value { text-align: right; white-space: nowrap; }
      .bar { position: relative; height: 8px; background: #241d3a; }
      .bar i { position: absolute; top: 0; bottom: 0; left: 0; background: var(--cyan); }
      .bar i.up { background: #39ff14; } .bar i.down { background: var(--pink); }
      .warn { color: var(--amber); font-size: 12px; margin-top: 4px; }
      .err { color: var(--pink); font-size: 12px; margin: 6px 0; }
      .hint { color: #8a82b0; font-size: 12px; margin: 6px 0; }

      .screen-head { position: absolute; top: 14px; left: 16px; right: 70px; display: flex; gap: 16px; align-items: center; }
      .cards { position: absolute; left: 12px; right: 12px; bottom: 12px; display: flex; gap: 12px; }
      .card { flex: 1; padding: 12px; max-height: 60vh; overflow-y: auto; }
      .card-title { font-size: 18px; font-weight: bold; margin-bottom: 2px; }
      .card-sub { color: #a89fd0; margin-bottom: 8px; }
      .parts { list-style: none; padding: 0; margin: 8px 0; font-size: 12px; }
      .parts li { display: flex; justify-content: space-between; gap: 8px; border-bottom: 1px solid #241d3a; padding: 2px 0; }
      .choose { width: 100%; margin-top: 4px; }

      .g-head { position: absolute; top: 12px; left: 16px; right: 64px; display: flex; justify-content: space-between; align-items: flex-start; }
      .g-head .race { pointer-events: auto; }
      .car-name { margin-top: 4px; font-size: 15px; font-weight: bold; }
      .g-slots { position: absolute; top: 124px; left: 12px; bottom: 12px; width: 232px; overflow-y: auto; padding: 4px; }
      .slot-btn {
        display: block; width: 100%; text-align: left; padding: 5px 8px; margin-bottom: 3px; background: #140c26;
        border: 2px solid transparent; color: var(--ink); font: bold 12px var(--font); cursor: pointer; text-transform: uppercase;
      }
      .slot-btn small { display: block; font-weight: normal; text-transform: none; font-size: 11px; }
      .slot-btn.empty small { color: #5a5280; }
      .slot-btn.active, .slot-btn:hover { border-color: var(--amber); }
      .g-side { position: absolute; top: 64px; right: 12px; bottom: 12px; width: 370px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
      .g-stats, .g-detail { padding: 10px; }
      .build-line { margin-top: 6px; font-size: 12px; color: #a89fd0; } .build-line b { color: var(--ink); }
      .part-card { background: #140c26; padding: 8px; margin-bottom: 6px; }
      .part-name { font-weight: bold; font-size: 14px; }
      .part-meta { font-size: 11px; margin: 3px 0; color: #a89fd0; }
      .trait { background: #33245a; color: var(--ink); padding: 0 5px; margin-right: 4px; }
      .part-stats span { display: inline-block; margin-right: 10px; font-size: 12px; color: #a89fd0; }
      .part-stats b { color: var(--ink); }
      .spare {
        display: flex; justify-content: space-between; width: 100%; padding: 6px 8px; margin-bottom: 3px; background: #140c26;
        border: 2px solid transparent; color: var(--ink); font: 12px var(--font); cursor: pointer; text-align: left;
      }
      .spare.on { border-color: var(--cyan); } .spare.bad small { color: var(--pink); } .spare small { color: #39ff14; }
      .preview { margin-top: 8px; border-top: 2px dashed #33245a; padding-top: 8px; }
      .row { display: flex; gap: 8px; margin-top: 6px; }
      .swatches { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
      .swatch { width: 30px; height: 30px; border: 2px solid #000; cursor: pointer; }
      .swatch.on { outline: 2px solid var(--amber); }
      .wheel-row { display: flex; gap: 10px; align-items: center; margin-bottom: 8px; }
      .wheel { width: 96px; height: 96px; border-radius: 50%; cursor: crosshair; touch-action: none; }
      .wheel-side { display: flex; flex-direction: column; gap: 6px; }
      .wheel-side input { display: block; width: 110px; }
      .wheel-now { width: 30px; height: 30px; border: 2px solid #000; }
      .finishes { display: flex; flex-wrap: wrap; gap: 6px; }
      .menu-action { justify-content: center; margin-top: 4px; }

      .cash { color: var(--amber); margin-left: 8px; }
      .event-list { position: absolute; top: 84px; left: 16px; width: min(460px, calc(100% - 32px)); bottom: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
      .event-card {
        display: flex; flex-direction: column; gap: 4px; text-align: left; padding: 10px 12px; background: var(--panel);
        border: 2px solid #33245a; color: var(--ink); font: 13px var(--font); cursor: pointer;
      }
      .event-card:hover { border-color: var(--amber); }
      .event-card b { font-size: 16px; }
      .event-card .tag { align-self: flex-start; }
      .event-desc { color: #a89fd0; font-size: 12px; }
      .event-meta { font-size: 12px; } .event-meta b { font-size: 12px; color: var(--amber); }
      #ui .results { display: flex; align-items: center; justify-content: center; background: rgba(8, 2, 20, 0.5); padding: 16px; }
      .results-panel {
        pointer-events: auto; width: min(460px, 100%); max-height: 100%; overflow-y: auto; background: var(--panel);
        border: 3px solid var(--pink); box-shadow: 0 0 0 3px #000, 6px 6px 0 3px var(--cyan); padding: 16px;
      }
      .standings { width: 100%; border-collapse: collapse; margin: 6px 0; font-size: 13px; }
      .standings td { padding: 3px 6px; border-bottom: 1px solid #241d3a; }
      .standings td:last-child { text-align: right; }
      .standings tr.me { color: var(--amber); font-weight: bold; }
      .reward-line { display: flex; justify-content: space-between; font-size: 13px; padding: 2px 0; }
      .reward-line.total { border-top: 2px solid #33245a; margin-top: 4px; font-size: 16px; color: var(--amber); }

      .city-map {
        position: absolute; top: 84px; left: 16px; width: min(58vw, calc((100vh - 110px) * 4 / 3)); aspect-ratio: 4 / 3;
        image-rendering: pixelated; border: 2px solid #33245a; pointer-events: auto; cursor: pointer;
      }
      .city-panel { position: absolute; top: 84px; right: 12px; bottom: 12px; width: min(420px, 38vw); overflow-y: auto; background: var(--panel); border: 2px solid #33245a; padding: 12px; pointer-events: auto; display: flex; flex-direction: column; gap: 6px; }
      .event-card:disabled { opacity: 0.55; cursor: default; }
      .event-card.done { opacity: 0.62; filter: saturate(0.5); }
      .event-card.done:hover { opacity: 0.9; }
      .event-result { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: #c8c0e8; }
      .event-result .retry { border: 1px solid var(--amber); color: var(--amber); padding: 1px 8px; font-size: 11px; letter-spacing: 1px; }
      .badge { font-size: 10px; padding: 1px 5px; margin-left: 4px; }
      .num { display: inline-block; min-width: 16px; text-align: center; color: #000; font-weight: bold; margin-right: 6px; padding: 0 3px; }
      .badge.boss { background: var(--pink); color: #000; } .badge.rival { background: var(--amber); color: #000; } .badge.clear { background: var(--green, #39ff14); color: #000; }
      .mods { display: flex; flex-wrap: wrap; gap: 4px; } .mod { font-size: 11px; color: #39ff14; border: 1px solid #1f5a1a; padding: 0 4px; }
      .shop-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 4px 0; border-bottom: 1px solid #241d3a; font-size: 12px; }
      .shop-row small { display: block; color: #8a82b0; }
      .wide { width: 100%; }
      .boss-banner { background: var(--amber); color: #000; font-weight: bold; padding: 6px 8px; margin: 6px 0; }
      #ui .lobby { display: flex; align-items: flex-start; justify-content: center; background: rgba(8, 2, 20, 0.7); padding: 16px; overflow-y: auto; pointer-events: auto; }
      .lobby-panel { background: var(--panel); border: 3px solid var(--pink); box-shadow: 6px 6px 0 var(--cyan); padding: 16px; width: min(640px, 100%); box-sizing: border-box; }
      .lobby select { font: bold 13px var(--font); background: #1a1030; color: var(--ink); border: 2px solid #33245a; padding: 4px; max-width: 100%; }
      .ev-row { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--amber); }
      /* Lobby spacing: room between controls for the focus outline (5 px each side). */
      .lobby .ev-row { display: grid; grid-template-columns: 56px minmax(0, 380px); gap: 12px; margin-top: 12px; }
      .lobby select { padding: 6px; }
      .lobby .row { flex-wrap: wrap; gap: 12px; margin-top: 12px; }
      .lobby .row:last-child { margin-top: 20px; }
      .lobby h3 { margin-top: 18px; }
      .lobby .hint { margin-top: 8px; }
      .lobby .seat { padding: 10px 12px; margin: 10px 0; }
      .lobby .seat-top { gap: 12px; }
      .lobby .add-player { margin-top: 4px; }
      .lobby .bot { padding: 4px 0; }
      .lobby .rank + .seat-pr { margin-left: 6px; }
      .seat { border: 2px solid #33245a; padding: 6px 8px; margin: 6px 0; }
      .seat-top { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
      .seat .pn { color: var(--cyan); font-size: 16px; }
      .seat-pr { font-size: 13px; }
      .seat .drop { margin-left: auto; }
      .record { font-size: 12px; color: #a89fd0; margin-top: 4px; }
      .rank { display: inline-block; min-width: 18px; text-align: center; font-weight: bold; color: #000; padding: 0 4px; }
      .rank-D { background: #c08050; } .rank-C { background: #b8b8c8; } .rank-B { background: #39ff14; } .rank-A { background: var(--cyan); } .rank-S { background: var(--amber); }
      .rank-warn { background: var(--pink); color: #000; padding: 6px 8px; margin: 8px 0; font-size: 13px; }
      .bot { display: flex; justify-content: space-between; font-size: 13px; padding: 2px 0; border-bottom: 1px solid #241d3a; }
      #ui .title-menu { display: flex; align-items: center; justify-content: center; background: radial-gradient(ellipse at center, #2a0f4a 0%, #0a0418 70%); padding: 16px; }
      .title-panel { display: flex; flex-direction: column; gap: 10px; width: min(420px, 100%); text-align: center; }
      .title-panel h1 { font-size: 34px !important; margin-bottom: 12px !important; }
      .title-btn { font-size: 18px; padding: 12px; text-align: left; }
      .menu-tabs, .menu-devices { display: flex; flex-wrap: wrap; gap: 4px; margin: 12px 0 6px; }
      .menu-tab { flex: 1; font: bold 12px var(--font); padding: 6px 4px; background: #1a1030; color: var(--ink); border: 2px solid #33245a; cursor: pointer; }
      .menu-tab.on { border-color: var(--cyan); color: var(--cyan); }
      .menu-sub { margin: 10px 0 0; font-size: 13px; color: var(--amber); }
      #menu .menu-panel { max-height: 90vh; overflow-y: auto; }
      .menu-wait { color: var(--pink) !important; }
      .bind-row { display: grid; grid-template-columns: minmax(0, 1fr) 92px 92px; gap: 4px; align-items: center; margin-bottom: 4px; color: var(--ink); font: bold 13px var(--font); text-transform: uppercase; }
      .bind-one { grid-template-columns: minmax(0, 1fr) 188px; }
      .bind-head { margin: 6px 0 2px; color: #a89fd0; font-size: 11px; }
      .bind-head span + span { text-align: center; }
      .bind-key { display: block; margin: 0; padding: 7px 4px; font-size: 13px; text-align: center; color: var(--cyan); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .menu-row input[type=range] { width: 110px; vertical-align: middle; accent-color: var(--cyan); }
      .menu-row:disabled { opacity: 0.4; }
      .room-code { color: var(--amber); font-size: 20px; letter-spacing: 4px; margin-left: 8px; }
      .code-in { width: 90px; font: bold 16px var(--font); text-transform: uppercase; letter-spacing: 3px; background: #1a1030; color: var(--ink); border: 2px solid #33245a; padding: 4px 6px; }
      .car-switch { display: flex; gap: 6px; align-items: center; margin-top: 6px; pointer-events: auto; font-size: 13px; }

      /* CRT curve on: heavier, slightly larger text survives the warp better. */
      body.crt #ui, body.crt #menu { font-weight: bold; letter-spacing: 0.02em; }
      body.crt .hint, body.crt .stat, body.crt .part-stats span, body.crt .shop-row { font-size: 13px; }

      @media (max-width: 760px) {
        .city-map { width: calc(100% - 32px); }
        .city-panel { top: auto; left: 0; right: 0; bottom: 0; width: auto; max-height: 48vh; }
        #ui h1 { font-size: 20px; }
        .cards { overflow-x: auto; scroll-snap-type: x mandatory; gap: 8px; }
        .card { flex: 0 0 calc(100% - 4px); scroll-snap-align: center; max-height: 55vh; }
        .g-slots { top: 112px; left: 0; right: 0; bottom: auto; width: auto; display: flex; overflow-x: auto; overflow-y: hidden; gap: 4px; }
        .slot-btn { flex: 0 0 140px; margin: 0; }
        .g-side { top: auto; left: 0; right: 0; bottom: 0; width: auto; max-height: 50vh; }
      }
      /* Button legend along the bottom of menus (src/ui/legend.js) */
      #legend {
        position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; pointer-events: none;
        display: flex; justify-content: flex-end; align-items: center; flex-wrap: wrap; gap: 6px 18px;
        min-height: 34px; padding: 4px max(14px, env(safe-area-inset-right)) max(4px, env(safe-area-inset-bottom)) 14px;
        background: rgba(8, 2, 20, 0.92); border-top: 2px solid #33245a;
        font: bold 12px var(--font); letter-spacing: 1px; text-transform: uppercase; color: var(--ink);
      }
      #legend span { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
      .lg-pad, .lg-key { display: inline-flex; align-items: center; justify-content: center; font: bold 11px var(--font); }
      .lg-pad { min-width: 20px; height: 20px; padding: 0 4px; border-radius: 10px; color: #000; }
      .lg-pad + .lg-pad { margin-left: 3px; }
      .lg-pad.a { background: #5cc93b; }
      .lg-pad.b { background: #ec4a3f; }
      .lg-pad.bumper { border-radius: 4px; background: #c9c3e6; }
      .lg-pad.dpad, .lg-pad.start { background: none; color: var(--ink); border: 2px solid var(--ink); font-size: 12px; }
      .lg-key { min-width: 22px; height: 20px; padding: 0 6px; border: 1px solid var(--ink); border-bottom-width: 3px; border-radius: 3px; text-transform: none; }
      body.legend-ui #ui .screen { bottom: 34px; }
      body.legend-menu #menu { padding-bottom: 50px; }
      .pad-focus { outline: 3px solid #ffe14d !important; outline-offset: 2px; box-shadow: 0 0 12px #ffe14d88; }
      .pad-open { outline-color: #4de1ff !important; }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="ui"></div>
