<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#160a2b" />
    <title>Torque &amp; Trigger</title>
    <style>
      :root {
        --night: #160a2b;
        --pink: #ff2a6d;
        --cyan: #05d9e8;
        --amber: #ffb000;
        --ink: #e8e8ff;
        --panel: rgba(12, 5, 30, 0.88);
        --font: 'Courier New', ui-monospace, monospace;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #000;
        color: var(--ink);
        font-family: var(--font);
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
      }
      #game { display: block; width: 100vw; height: 100vh; }
      [hidden] { display: none !important; }

      #pause-btn {
        position: fixed;
        top: max(8px, env(safe-area-inset-top));
        right: max(8px, env(safe-area-inset-right));
        width: 40px;
        height: 40px;
        border: 2px solid var(--cyan);
        background: var(--panel);
        color: var(--cyan);
        font: bold 16px var(--font);
        cursor: pointer;
        z-index: 3;
      }

      /* Pause menu */
      #menu {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(8, 2, 20, 0.55);
        z-index: 4;
        padding: 16px;
      }
      .menu-panel {
        width: min(440px, 100%);
        max-height: 100%;
        overflow-y: auto;
        background: var(--panel);
        border: 3px solid var(--pink);
        box-shadow: 0 0 0 3px #000, 6px 6px 0 3px var(--cyan);
        padding: 16px;
      }
      .menu-panel h1 {
        margin: 0 0 12px;
        font-size: 28px;
        letter-spacing: 4px;
        color: var(--pink);
        text-shadow: 3px 3px 0 #000;
      }
      .menu-row, .menu-resume {
        display: flex;
        justify-content: space-between;
        width: 100%;
        padding: 9px 10px;
        margin-bottom: 4px;
        background: #1a1030;
        border: 2px solid #33245a;
        color: var(--ink);
        font: bold 15px var(--font);
        text-transform: uppercase;
        cursor: pointer;
      }
      .menu-row:hover, .menu-row:focus-visible { border-color: var(--cyan); outline: none; }
      .menu-value { color: var(--cyan); }
      .menu-resume {
        justify-content: center;
        margin-top: 10px;
        background: var(--pink);
        border-color: #000;
        color: #000;
        font-size: 18px;
      }
      .menu-help { margin-top: 12px; font-size: 12px; line-height: 1.5; color: #a89fd0; }
      .menu-help b { color: var(--amber); }

      /* Touch controls */
      #touch { position: fixed; inset: 0; pointer-events: none; z-index: 2; }
      #touch > * { pointer-events: auto; }
      .t-steer {
        position: absolute;
        left: 0;
        bottom: 0;
        width: 42%;
        height: 55%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-end;
        padding-bottom: max(28px, env(safe-area-inset-bottom));
      }
      .t-steer-track {
        width: 150px;
        height: 22px;
        border: 2px solid var(--cyan);
        background: rgba(12, 5, 30, 0.5);
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .t-steer-knob { width: 34px; height: 34px; background: var(--cyan); border: 2px solid #000; }
      .t-label { margin-top: 6px; font: bold 11px var(--font); color: var(--cyan); opacity: 0.7; }
      .t-buttons {
        position: absolute;
        right: max(14px, env(safe-area-inset-right));
        bottom: max(18px, env(safe-area-inset-bottom));
        display: grid;
        grid-template-columns: 78px 92px;
        grid-template-rows: 64px 92px;
        gap: 10px;
      }
      .t-btn {
        border: 2px solid var(--ink);
        background: rgba(12, 5, 30, 0.55);
        color: var(--ink);
        font: bold 14px var(--font);
        touch-action: none;
      }
      .t-btn.down { background: var(--ink); color: #000; }
      .t-gas { grid-column: 2; grid-row: 2; border-color: var(--cyan); color: var(--cyan); }
      .t-brake { grid-column: 1; grid-row: 2; border-color: var(--pink); color: var(--pink); }
      .t-nitro { grid-column: 2; grid-row: 1; border-color: var(--amber); color: var(--amber); }
      .t-drift { grid-column: 1; grid-row: 1; }
      .t-top {
        position: absolute;
        top: max(8px, env(safe-area-inset-top));
        right: calc(max(8px, env(safe-area-inset-right)) + 50px);
        display: flex;
        gap: 8px;
      }
      .t-small { width: 64px; height: 40px; font-size: 12px; }

      /* Screens (starter selection, garage) */
      #ui { position: fixed; inset: 0; pointer-events: none; z-index: 1; font-size: 13px; }
      #ui .screen { position: absolute; inset: 0; }
      #ui button, #ui .card, #ui .g-slots, #ui .g-side { pointer-events: auto; }
      #ui h1 { margin: 0; font-size: 26px; letter-spacing: 3px; color: var(--pink); text-shadow: 3px 3px 0 #000; }
      #ui h2 { margin: 0 0 8px; font-size: 17px; color: var(--cyan); text-transform: uppercase; }
      #ui h3 { margin: 12px 0 6px; font-size: 13px; color: var(--amber); text-transform: uppercase; }
      .btn {
        font: bold 14px var(--font); padding: 8px 14px; background: #1a1030; color: var(--ink);
        border: 2px solid #33245a; cursor: pointer; text-transform: uppercase;
      }
      .btn:hover:not(:disabled) { border-color: var(--cyan); }
      .btn.primary { background: var(--pink); color: #000; border-color: #000; box-shadow: 3px 3px 0 var(--cyan); }
      .btn.small { padding: 5px 9px; font-size: 12px; }
      .btn.on { border-color: var(--cyan); color: var(--cyan); }
      .btn:disabled { opacity: 0.4; cursor: default; }
      .tag { background: var(--cyan); color: #000; padding: 1px 6px; font-size: 11px; vertical-align: middle; }
      .q-junk { color: #c08050; } .q-stock { color: #b8b8c8; } .q-street { color: #ffffff; }
      .q-sport { color: #39ff14; } .q-race { color: var(--cyan); } .q-elite { color: var(--amber); }
      .panel, .card, .g-stats, .g-detail, .g-slots {
        background: var(--panel); border: 2px solid #33245a;
      }
      .pr { font-size: 15px; margin-bottom: 6px; } .pr b { font-size: 22px; color: var(--amber); }
      .up { color: #39ff14; } .down { color: var(--pink); }
      .stat { display: grid; grid-template-columns: 92px minmax(40px, 1fr) auto; gap: 8px; align-items: center; margin: 2px 0; font-size: 12px; }
      .stat-label { color: #a89fd0; }
      .stat-value { text-align: right; white-space: nowrap; }
      .bar { position: relative; height: 8px; background: #241d3a; }
      .bar i { position: absolute; top: 0; bottom: 0; left: 0; background: var(--cyan); }
      .bar i.up { background: #39ff14; } .bar i.down { background: var(--pink); }
      .warn { color: var(--amber); font-size: 12px; margin-top: 4px; }
      .err { color: var(--pink); font-size: 12px; margin: 6px 0; }
      .hint { color: #8a82b0; font-size: 12px; margin: 6px 0; }

      .screen-head { position: absolute; top: 14px; left: 16px; right: 70px; display: flex; gap: 16px; align-items: center; }
      .cards { position: absolute; left: 12px; right: 12px; bottom: 12px; display: flex; gap: 12px; }
      .card { flex: 1; padding: 12px; max-height: 60vh; overflow-y: auto; }
      .card-title { font-size: 18px; font-weight: bold; margin-bottom: 2px; }
      .card-sub { color: #a89fd0; margin-bottom: 8px; }
      .parts { list-style: none; padding: 0; margin: 8px 0; font-size: 12px; }
      .parts li { display: flex; justify-content: space-between; gap: 8px; border-bottom: 1px solid #241d3a; padding: 2px 0; }
      .choose { width: 100%; margin-top: 4px; }

      .g-head { position: absolute; top: 12px; left: 16px; right: 64px; display: flex; justify-content: space-between; align-items: flex-start; }
      .g-head .race { pointer-events: auto; }
      .car-name { margin-top: 4px; font-size: 15px; font-weight: bold; }
      .g-slots { position: absolute; top: 84px; left: 12px; bottom: 12px; width: 232px; overflow-y: auto; padding: 4px; }
      .slot-btn {
        display: block; width: 100%; text-align: left; padding: 5px 8px; margin-bottom: 3px; background: #140c26;
        border: 2px solid transparent; color: var(--ink); font: bold 12px var(--font); cursor: pointer; text-transform: uppercase;
      }
      .slot-btn small { display: block; font-weight: normal; text-transform: none; font-size: 11px; }
      .slot-btn.empty small { color: #5a5280; }
      .slot-btn.active, .slot-btn:hover { border-color: var(--amber); }
      .g-side { position: absolute; top: 64px; right: 12px; bottom: 12px; width: 370px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
      .g-stats, .g-detail { padding: 10px; }
      .build-line { margin-top: 6px; font-size: 12px; color: #a89fd0; } .build-line b { color: var(--ink); }
      .part-card { background: #140c26; padding: 8px; margin-bottom: 6px; }
      .part-name { font-weight: bold; font-size: 14px; }
      .part-meta { font-size: 11px; margin: 3px 0; color: #a89fd0; }
      .trait { background: #33245a; color: var(--ink); padding: 0 5px; margin-right: 4px; }
      .part-stats span { display: inline-block; margin-right: 10px; font-size: 12px; color: #a89fd0; }
      .part-stats b { color: var(--ink); }
      .spare {
        display: flex; justify-content: space-between; width: 100%; padding: 6px 8px; margin-bottom: 3px; background: #140c26;
        border: 2px solid transparent; color: var(--ink); font: 12px var(--font); cursor: pointer; text-align: left;
      }
      .spare.on { border-color: var(--cyan); } .spare.bad small { color: var(--pink); } .spare small { color: #39ff14; }
      .preview { margin-top: 8px; border-top: 2px dashed #33245a; padding-top: 8px; }
      .row { display: flex; gap: 8px; margin-top: 6px; }
      .swatches { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
      .swatch { width: 30px; height: 30px; border: 2px solid #000; cursor: pointer; }
      .swatch.on { outline: 2px solid var(--amber); }
      .finishes { display: flex; flex-wrap: wrap; gap: 6px; }
      .menu-action { justify-content: center; margin-top: 4px; }

      @media (max-width: 760px) {
        #ui h1 { font-size: 20px; }
        .cards { overflow-x: auto; scroll-snap-type: x mandatory; gap: 8px; }
        .card { flex: 0 0 calc(100% - 4px); scroll-snap-align: center; max-height: 55vh; }
        .g-slots { top: 74px; left: 0; right: 0; bottom: auto; width: auto; display: flex; overflow-x: auto; overflow-y: hidden; gap: 4px; }
        .slot-btn { flex: 0 0 140px; margin: 0; }
        .g-side { top: auto; left: 0; right: 0; bottom: 0; width: auto; max-height: 50vh; }
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="ui"></div>
    <div id="touch" hidden></div>
    <button id="pause-btn" aria-label="Pause">II</button>
    <div id="menu" hidden></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
